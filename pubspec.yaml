name: expense_tracker
description: "Трекер Расходов — приложение учёта личных и служебных расходов для ОС Аврора"
publish_to: 'none'

version: 1.0.0+1

# Читает тулчейн ОС Аврора: из них складывается идентификатор пакета
# ru.auroraos.expense_tracker и поле License в RPM. Без них берутся
# значения по умолчанию — com.example и Proprietary.
organization: ru.auroraos
license: BSD-3-Clause

environment:
  # Нижняя граница — Dart из Flutter для ОС Аврора 3.41.4 (Dart 3.11.1).
  sdk: '>=3.11.0 <4.0.0'
  # Целевая версия Flutter из технического задания.
  flutter: '>=3.35.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Состояние
  provider: ^6.1.0

  # Локальное хранение данных
  path_provider: ^2.1.0
  path: ^1.9.0
  shared_preferences: ^2.5.0

  # Чеки: камера и галерея. На ОС Аврора эти пакеты приходят из
  # pub-репозитория ОМП и сами подключают реализации *_aurora.
  image_picker: ^1.1.2

  # Импорт CSV из локальных файлов
  file_selector: ^1.0.0
  csv: ^8.0.0

  # Форматирование дат и сумм
  intl: ^0.20.2

  # Диаграммы дашборда
  fl_chart: ^1.2.0

  uuid: ^4.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
